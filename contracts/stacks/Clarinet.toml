[project]
name = "automata-stacks"
description = "Automata cross-chain agent — Bitcoin L2 contracts (Stacks/Clarity)"
authors = ["sam-rytech", "jadonamite"]
telemetry = true
cache_dir = "./.cache"

# [contracts.counter]
# path = "contracts/counter.clar"
# epoch = "latest"

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

[contracts.automata-stacker]
path = "contracts/automata-stacker.clar"
clarity_version = 3
epoch = "latest"

[contracts.automata-sbtc-vault]
path = "contracts/automata-sbtc-vault.clar"
clarity_version = 3
epoch = "latest"

[contracts.automata-intent]
path = "contracts/automata-intent.clar"
clarity_version = 3
epoch = "latest"

# Test-only token. Excluded from mainnet deployment plan.
[contracts.mock-sbtc]
path = "contracts/mock-sbtc.clar"
clarity_version = 3
epoch = "latest"
